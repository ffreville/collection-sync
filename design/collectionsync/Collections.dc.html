<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg: oklch(0.965 0.008 75);
    --surface: oklch(0.995 0.004 75);
    --text: oklch(0.24 0.02 55);
    --text-muted: oklch(0.50 0.02 55);
    --accent: oklch(0.62 0.15 45);
    --accent-contrast: oklch(0.99 0.004 75);
    --accent-soft: oklch(0.93 0.035 45);
    --border: oklch(0.90 0.012 70);
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); } a:hover { color: oklch(0.52 0.15 45); }
  body { margin:0; font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  .phone { width:390px; height:844px; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .header { display:flex; align-items:center; gap:12px; padding: 56px 20px 14px; }
  .iconbtn { width:36px;height:36px;border-radius:12px; display:flex;align-items:center;justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text); flex-shrink:0; }
  .header h1 { font-size:22px; font-weight:800; letter-spacing:-0.01em; margin:0; }
  .content { flex:1; overflow:hidden; padding: 6px 20px 24px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px; }
  .mosaic { width:64px; height:64px; border-radius:14px; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; flex-shrink:0; }
  .mosaic div { }
  .grow { flex:1; min-width:0; }
  .name { font-weight:700; font-size:15.5px; }
  .sub { font-size:12.5px; color:var(--text-muted); margin-top:3px; }
  .chev { color:var(--text-muted); flex-shrink:0; }
  .fab { position:absolute; right:22px; bottom:28px; width:58px; height:58px; border-radius:20px; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 24px oklch(0.62 0.15 45 / 0.35); }
</style>
</helmet>
<div class="phone">
  <div class="header">
    <div class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1>Marvel</h1>
  </div>
  <div class="content">

    <div class="row">
      <div class="mosaic">
        <div style="background:oklch(0.7 0.13 40 / 0.5)"></div>
        <div style="background:oklch(0.65 0.15 45 / 0.7)"></div>
        <div style="background:oklch(0.75 0.1 50 / 0.4)"></div>
        <div style="background:oklch(0.6 0.14 45 / 0.6)"></div>
      </div>
      <div class="grow">
        <div class="name">Figurines Marvel Legends</div>
        <div class="sub">48 objets · 6 champs personnalisés</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="row">
      <div class="mosaic">
        <div style="background:oklch(0.7 0.1 200 / 0.4)"></div>
        <div style="background:oklch(0.65 0.12 210 / 0.6)"></div>
        <div style="background:oklch(0.75 0.08 220 / 0.35)"></div>
        <div style="background:oklch(0.6 0.1 205 / 0.55)"></div>
      </div>
      <div class="grow">
        <div class="name">Comics — éditions rares</div>
        <div class="sub">31 objets · 4 champs personnalisés</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="row">
      <div class="mosaic">
        <div style="background:oklch(0.72 0.09 145 / 0.4)"></div>
        <div style="background:oklch(0.6 0.11 150 / 0.6)"></div>
        <div style="background:oklch(0.78 0.07 140 / 0.35)"></div>
        <div style="background:oklch(0.55 0.1 148 / 0.55)"></div>
      </div>
      <div class="grow">
        <div class="name">Pop! Vinyl</div>
        <div class="sub">33 objets · 2 champs personnalisés</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

  </div>
  <div class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
</div>
</x-dc>
</body>
</html>
