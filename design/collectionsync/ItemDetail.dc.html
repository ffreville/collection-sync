<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg: oklch(0.965 0.008 75);
    --surface: oklch(0.995 0.004 75);
    --text: oklch(0.24 0.02 55);
    --text-muted: oklch(0.50 0.02 55);
    --accent: oklch(0.62 0.15 45);
    --accent-contrast: oklch(0.99 0.004 75);
    --accent-soft: oklch(0.93 0.035 45);
    --border: oklch(0.90 0.012 70);
    --danger: oklch(0.58 0.17 25);
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); } a:hover { color: oklch(0.52 0.15 45); }
  body { margin:0; font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  .phone { width:390px; height:844px; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }
  .header { display:flex; align-items:center; gap:12px; padding: 56px 20px 12px; }
  .iconbtn { width:36px;height:36px;border-radius:12px; display:flex;align-items:center;justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text); flex-shrink:0; }
  .header h1 { font-size:18px; font-weight:800; letter-spacing:-0.01em; margin:0; flex:1; }
  .save { font-weight:700; font-size:14.5px; color:var(--accent); }
  .content { flex:1; overflow:hidden; padding: 4px 20px 30px; display:flex; flex-direction:column; gap:16px; }
  .photobox { height:180px; border-radius:20px; background: linear-gradient(160deg, oklch(0.68 0.14 40), oklch(0.55 0.15 30)); position:relative; }
  .photobadge { position:absolute; right:12px; bottom:12px; width:38px; height:38px; border-radius:12px; background:oklch(0.2 0.02 55 / 0.55); color:white; display:flex; align-items:center; justify-content:center; }
  .field-label { font-size:12.5px; font-weight:700; margin-bottom:7px; display:block; color:var(--text-muted); }
  .input { width:100%; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); padding:13px 15px; font-size:15px; font-family:inherit; color:var(--text); }
  .selectfield { display:flex; align-items:center; justify-content:space-between; width:100%; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); padding:13px 15px; font-size:15px; color:var(--text); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stepper { display:flex; align-items:center; justify-content:space-between; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); padding:8px 10px; }
  .stepper button { width:30px; height:30px; border-radius:9px; border:none; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:16px; }
  .stepper .val { font-weight:700; }
  textarea.input { resize:none; height:76px; font-family:inherit; }
  .eyebrow { font-size:11.5px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-muted); margin: 4px 0 2px; }
  .divider { height:1px; background:var(--border); margin: 2px 0; }
  .toggle { width:44px; height:26px; border-radius:999px; background:var(--border); position:relative; flex-shrink:0; }
  .toggle.on { background:var(--accent); }
  .toggle .knob { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:white; }
  .toggle.on .knob { left:21px; }
  .fieldicon-inline { color:var(--text-muted); }
  .field-with-icon { display:flex; align-items:center; gap:10px; }
  .delete { color:var(--danger); font-weight:700; font-size:14px; text-align:center; padding-top:4px; }
</style>
</helmet>
<div class="phone">
  <div class="header">
    <div class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1>Modifier l'objet</h1>
    <span class="save">Enregistrer</span>
  </div>
  <div class="content">

    <div class="photobox">
      <div class="photobadge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.3"/></svg></div>
    </div>

    <div>
      <label class="field-label">Nom</label>
      <input class="input" value="Iron Man Mark 85">
    </div>

    <div class="row2">
      <div>
        <label class="field-label">Catégorie</label>
        <div class="selectfield">Action Figure <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
      <div>
        <label class="field-label">État</label>
        <div class="selectfield">Neuf <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
    </div>

    <div class="row2">
      <div>
        <label class="field-label">Quantité</label>
        <div class="stepper"><button>–</button><span class="val">1</span><button>+</button></div>
      </div>
      <div>
        <label class="field-label">Valeur estimée</label>
        <input class="input" value="45,00 €">
      </div>
    </div>

    <div>
      <label class="field-label">Notes</label>
      <textarea class="input" style="height:64px;">Acheté en édition limitée au Comic Con 2023.</textarea>
    </div>

    <div class="divider"></div>
    <div class="eyebrow">Détails</div>

    <div>
      <label class="field-label">Éditeur</label>
      <input class="input" value="Hot Toys">
    </div>

    <div class="row2">
      <div>
        <label class="field-label">Numéro d'édition</label>
        <input class="input" value="128 / 500">
      </div>
      <div>
        <label class="field-label">Date de sortie</label>
        <div class="field-with-icon selectfield">
          <svg class="fieldicon-inline" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          12/04/2024
        </div>
      </div>
    </div>

    <div class="selectfield">
      <span class="field-with-icon"><svg class="fieldicon-inline" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Signé</span>
      <div class="toggle"><div class="knob"></div></div>
    </div>

    <div>
      <label class="field-label">Fiche produit</label>
      <div class="field-with-icon selectfield">
        <svg class="fieldicon-inline" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M13 5l1.5-1.5a4 4 0 015.5 5.5L18 11"/><path d="M11 19l-1.5 1.5a4 4 0 01-5.5-5.5L6 13"/></svg>
        hottoys.com/ironman-mk85
      </div>
    </div>

    <div class="delete">Supprimer cet objet</div>

  </div>
</div>
</x-dc>
</body>
</html>
