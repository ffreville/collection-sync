<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg: oklch(0.965 0.008 75);
    --surface: oklch(0.995 0.004 75);
    --text: oklch(0.24 0.02 55);
    --text-muted: oklch(0.50 0.02 55);
    --accent: oklch(0.62 0.15 45);
    --accent-contrast: oklch(0.99 0.004 75);
    --accent-soft: oklch(0.93 0.035 45);
    --border: oklch(0.90 0.012 70);
    --online: oklch(0.68 0.14 150);
    --neutral-avatar: oklch(0.85 0.02 70);
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); } a:hover { color: oklch(0.52 0.15 45); }
  body { margin:0; font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  .phone { width:390px; height:844px; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }
  .header { padding: 56px 24px 8px; }
  .header h1 { font-size:26px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .content { flex:1; overflow:hidden; padding: 12px 20px 24px; display:flex; flex-direction:column; gap:10px; }
  .eyebrow { font-size:11.5px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-muted); margin: 18px 4px 4px; }
  .row { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:14px 16px; }
  .avatar { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0; }
  .avatar-you { background:var(--accent); color:var(--accent-contrast); }
  .avatar-other { background:var(--neutral-avatar); color:oklch(0.30 0.02 70); }
  .grow { flex:1; min-width:0; }
  .name-line { display:flex; align-items:center; gap:8px; }
  .name { font-weight:700; font-size:15.5px; }
  .status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sub { font-size:13px; color:var(--text-muted); margin-top:2px; }
  .pill { padding:5px 10px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
  .pill-accent { background:var(--accent); color:var(--accent-contrast); }
  .pill-outline { background:var(--accent-soft); color:var(--accent); }
  .chev { color:var(--text-muted); flex-shrink:0; }
  .footer { padding: 8px 20px 28px; }
  .btn-outline { width:100%; border-radius:999px; padding:15px; font-weight:700; font-size:14.5px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; }
</style>
</helmet>
<div class="phone">
  <div class="header"><h1>Utilisateurs</h1></div>
  <div class="content">

    <div class="eyebrow" style="margin-top:2px">Vous</div>
    <div class="row">
      <div class="avatar avatar-you">F</div>
      <div class="grow">
        <div class="name-line"><span class="name">Fred</span></div>
        <div class="sub">3 univers · accès complet</div>
      </div>
      <span class="pill pill-accent">Vous</span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="eyebrow">Synchronisé avec vous</div>

    <div class="row">
      <div class="avatar avatar-other">C</div>
      <div class="grow">
        <div class="name-line">
          <span class="name">Camille</span>
          <span class="status-dot" style="background:var(--online)"></span>
        </div>
        <div class="sub">En ligne · 2 univers partagés</div>
      </div>
      <span class="pill pill-outline">Lecture seule</span>
    </div>

    <div class="row">
      <div class="avatar avatar-other">T</div>
      <div class="grow">
        <div class="name-line">
          <span class="name">Théo</span>
          <span class="status-dot" style="background:var(--border)"></span>
        </div>
        <div class="sub">Vu hier · 1 univers partagé</div>
      </div>
      <span class="pill pill-outline">Lecture seule</span>
    </div>

    <div class="row">
      <div class="avatar avatar-other">M</div>
      <div class="grow">
        <div class="name-line">
          <span class="name">Marion</span>
          <span class="status-dot" style="background:var(--border)"></span>
        </div>
        <div class="sub">Vue il y a 4 jours · 5 univers partagés</div>
      </div>
      <span class="pill pill-outline">Lecture seule</span>
    </div>

  </div>
  <div class="footer">
    <button class="btn-outline">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M5.5 15a8 8 0 0013 3.5M18.5 9A8 8 0 005.5 5.5"/></svg>
      Synchroniser un nouvel appareil
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
