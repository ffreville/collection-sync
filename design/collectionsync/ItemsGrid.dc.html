<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg: oklch(0.965 0.008 75);
    --surface: oklch(0.995 0.004 75);
    --text: oklch(0.24 0.02 55);
    --text-muted: oklch(0.50 0.02 55);
    --accent: oklch(0.62 0.15 45);
    --accent-contrast: oklch(0.99 0.004 75);
    --accent-soft: oklch(0.93 0.035 45);
    --border: oklch(0.90 0.012 70);
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); } a:hover { color: oklch(0.52 0.15 45); }
  body { margin:0; font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  .phone { width:390px; height:844px; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .header { display:flex; align-items:center; gap:10px; padding: 56px 20px 12px; }
  .iconbtn { width:36px;height:36px;border-radius:12px; display:flex;align-items:center;justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text); flex-shrink:0; }
  .header h1 { font-size:17.5px; font-weight:800; letter-spacing:-0.01em; margin:0; flex:1; }
  .segment { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:3px; gap:2px; }
  .segment .seg { width:32px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); }
  .segment .seg.active { background:var(--accent); color:var(--accent-contrast); }
  .searchbar { display:flex; align-items:center; gap:10px; margin: 0 20px 12px; }
  .searchinput { flex:1; display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border); border-radius:13px; padding:11px 14px; color:var(--text-muted); font-size:14px; }
  .filterbtn { width:42px; height:42px; border-radius:13px; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; position:relative; color:var(--text); flex-shrink:0; }
  .filterbtn .dot { position:absolute; top:8px; right:8px; width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .chiprow { display:flex; gap:8px; padding: 0 20px 14px; overflow:hidden; }
  .fchip { display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12.5px; font-weight:700; white-space:nowrap; }
  .content { flex:1; overflow:hidden; padding: 0 20px 24px; display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:start; }
  .card { border-radius:18px; overflow:hidden; background:var(--surface); border:1px solid var(--border); }
  .photo { height:140px; position:relative; }
  .price { position:absolute; top:10px; right:10px; background:oklch(0.2 0.02 55 / 0.72); color:white; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; }
  .info { padding:10px 12px 13px; }
  .iname { font-weight:700; font-size:13.5px; line-height:1.3; margin-bottom:3px; }
  .imeta { font-size:11.5px; color:var(--text-muted); }
  .fab { position:absolute; right:22px; bottom:28px; width:58px; height:58px; border-radius:20px; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 24px oklch(0.62 0.15 45 / 0.35); }
</style>
</helmet>
<div class="phone">
  <div class="header">
    <div class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1>Figurines Marvel Legends</h1>
    <div class="segment">
      <div class="seg"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.1" fill="currentColor" stroke="none"/></svg></div>
      <div class="seg active"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
    </div>
  </div>

  <div class="searchbar">
    <div class="searchinput">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      Rechercher…
    </div>
    <div class="filterbtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
      <div class="dot"></div>
    </div>
  </div>

  <div class="chiprow">
    <span class="fchip">Action Figure <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
    <span class="fchip">Neuf <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
  </div>

  <div class="content">

    <div class="card">
      <div class="photo" style="background: linear-gradient(160deg, oklch(0.68 0.14 40), oklch(0.55 0.15 30));"><span class="price">45 €</span></div>
      <div class="info"><div class="iname">Iron Man Mark 85</div><div class="imeta">Action Figure · ×1</div></div>
    </div>

    <div class="card">
      <div class="photo" style="background: linear-gradient(160deg, oklch(0.7 0.12 250), oklch(0.5 0.16 260));"><span class="price">38 €</span></div>
      <div class="info"><div class="iname">Captain America</div><div class="imeta">Action Figure · ×1</div></div>
    </div>

    <div class="card">
      <div class="photo" style="background: linear-gradient(160deg, oklch(0.72 0.13 130), oklch(0.5 0.14 140));"></div>
      <div class="info"><div class="iname">Hulk — édition Gamma</div><div class="imeta">Statue · ×1</div></div>
    </div>

    <div class="card">
      <div class="photo" style="background: linear-gradient(160deg, oklch(0.75 0.12 90), oklch(0.55 0.15 60));"><span class="price">22 €</span></div>
      <div class="info"><div class="iname">Thor Pop!</div><div class="imeta">Pop! · ×2</div></div>
    </div>

    <div class="card">
      <div class="photo" style="background: linear-gradient(160deg, oklch(0.65 0.14 340), oklch(0.45 0.16 330));"></div>
      <div class="info"><div class="iname">Black Widow</div><div class="imeta">Action Figure · ×1</div></div>
    </div>

    <div class="card">
      <div class="photo" style="background: linear-gradient(160deg, oklch(0.7 0.1 20), oklch(0.5 0.14 15));"><span class="price">65 €</span></div>
      <div class="info"><div class="iname">Thanos — Infinity Saga</div><div class="imeta">Statue · ×1</div></div>
    </div>

  </div>

  <div class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
</div>
</x-dc>
</body>
</html>
