<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg: oklch(0.965 0.008 75);
    --surface: oklch(0.995 0.004 75);
    --text: oklch(0.24 0.02 55);
    --text-muted: oklch(0.50 0.02 55);
    --accent: oklch(0.62 0.15 45);
    --accent-contrast: oklch(0.99 0.004 75);
    --accent-soft: oklch(0.93 0.035 45);
    --border: oklch(0.90 0.012 70);
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); } a:hover { color: oklch(0.52 0.15 45); }
  body { margin:0; font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  .phone { width:390px; height:844px; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .header { display:flex; align-items:center; gap:12px; padding: 56px 20px 14px; }
  .iconbtn { width:36px;height:36px;border-radius:12px; display:flex;align-items:center;justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text); flex-shrink:0; }
  .header h1 { font-size:22px; font-weight:800; letter-spacing:-0.01em; margin:0; }
  .header .badge { margin-left:auto; }
  .pill-accent { padding:5px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--accent); color:var(--accent-contrast); }
  .content { flex:1; overflow:hidden; padding: 6px 20px 24px; display:grid; grid-template-columns: repeat(2, 1fr); gap:14px; align-content:start; }
  .tile { border-radius:20px; overflow:hidden; background:var(--surface); border:1px solid var(--border); display:flex; flex-direction:column; }
  .tile .cover { height:96px; position:relative; overflow:hidden; }
  .tile .cover .dot { position:absolute; border-radius:50%; }
  .tile .info { padding:12px 14px 14px; }
  .tile .name { font-weight:700; font-size:14.5px; margin-bottom:2px; }
  .tile .count { font-size:12px; color:var(--text-muted); }
  .fab { position:absolute; right:22px; bottom:28px; width:58px; height:58px; border-radius:20px; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 24px oklch(0.62 0.15 45 / 0.35); }
</style>
</helmet>
<div class="phone">
  <div class="header">
    <div class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1>Univers de Fred</h1>
    <span class="badge pill-accent">Vous</span>
  </div>
  <div class="content">

    <div class="tile">
      <div class="cover" style="background: oklch(0.62 0.15 45 / 0.16)">
        <div class="dot" style="width:70px;height:70px; background:oklch(0.62 0.15 45 / 0.35); top:-15px; right:-10px;"></div>
        <div class="dot" style="width:34px;height:34px; background:var(--accent); bottom:14px; left:16px;"></div>
      </div>
      <div class="info"><div class="name">Marvel</div><div class="count">3 collections · 112 objets</div></div>
    </div>

    <div class="tile">
      <div class="cover" style="background: oklch(0.7 0.1 200 / 0.18)">
        <div class="dot" style="width:60px;height:60px; background:oklch(0.7 0.1 200 / 0.4); bottom:-20px; right:10px;"></div>
        <div class="dot" style="width:24px;height:24px; background:oklch(0.55 0.1 200); top:16px; left:18px;"></div>
      </div>
      <div class="info"><div class="name">Disney</div><div class="count">2 collections · 64 objets</div></div>
    </div>

    <div class="tile">
      <div class="cover" style="background: oklch(0.75 0.09 145 / 0.2)">
        <div class="dot" style="width:50px;height:50px; background:oklch(0.6 0.1 145 / 0.4); top:10px; right:-10px;"></div>
        <div class="dot" style="width:30px;height:30px; background:oklch(0.55 0.1 145); bottom:10px; left:20px;"></div>
      </div>
      <div class="info"><div class="name">Star Wars</div><div class="count">1 collection · 27 objets</div></div>
    </div>

    <div class="tile" style="border-style:dashed; align-items:center; justify-content:center; display:flex;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:30px 10px; color:var(--text-muted);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span style="font-size:12.5px; font-weight:600;">Nouvel univers</span>
      </div>
    </div>

  </div>
  <div class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
</div>
</x-dc>
</body>
</html>
