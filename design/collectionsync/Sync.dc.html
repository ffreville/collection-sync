<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg: oklch(0.965 0.008 75);
    --surface: oklch(0.995 0.004 75);
    --text: oklch(0.24 0.02 55);
    --text-muted: oklch(0.50 0.02 55);
    --accent: oklch(0.62 0.15 45);
    --accent-contrast: oklch(0.99 0.004 75);
    --accent-soft: oklch(0.93 0.035 45);
    --border: oklch(0.90 0.012 70);
    --online: oklch(0.68 0.14 150);
    --warn: oklch(0.75 0.15 80);
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); } a:hover { color: oklch(0.52 0.15 45); }
  body { margin:0; font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  .phone { width:390px; height:844px; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }
  .header { display:flex; align-items:center; gap:12px; padding: 56px 20px 14px; }
  .iconbtn { width:36px;height:36px;border-radius:12px; display:flex;align-items:center;justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text); flex-shrink:0; }
  .header h1 { font-size:22px; font-weight:800; letter-spacing:-0.01em; margin:0; }
  .content { flex:1; overflow:hidden; padding: 4px 20px 24px; display:flex; flex-direction:column; gap:12px; }
  .banner { display:flex; align-items:center; gap:10px; background:var(--accent-soft); color:var(--accent); border-radius:14px; padding:12px 14px; font-size:13px; font-weight:700; }
  .eyebrow { font-size:11.5px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-muted); margin: 10px 2px 2px; }
  .row { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:14px 16px; }
  .devicon { width:44px; height:44px; border-radius:14px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .grow { flex:1; min-width:0; }
  .dname { font-weight:700; font-size:15px; }
  .dsub { font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .btn-small { padding:9px 16px; border-radius:999px; font-weight:700; font-size:13px; border:none; background:var(--accent); color:var(--accent-contrast); font-family:inherit; white-space:nowrap; }
  .btn-small-outline { padding:9px 16px; border-radius:999px; font-weight:700; font-size:13px; border:1.5px solid var(--border); background:transparent; color:var(--text); font-family:inherit; white-space:nowrap; }
  .progress-row { display:flex; flex-direction:column; gap:8px; }
  .progress-top { display:flex; align-items:center; gap:12px; }
  .spinner { width:20px; height:20px; border-radius:50%; border:2.5px solid var(--accent-soft); border-top-color:var(--accent); flex-shrink:0; }
  .bar { height:6px; border-radius:999px; background:var(--accent-soft); overflow:hidden; }
  .bar .fill { height:100%; width:64%; background:var(--accent); border-radius:999px; }
  .resultcard { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .resulttop { display:flex; align-items:center; gap:10px; }
  .warnbadge { width:34px; height:34px; border-radius:11px; background: oklch(0.75 0.15 80 / 0.25); color: oklch(0.5 0.14 70); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
</style>
</helmet>
<div class="phone">
  <div class="header">
    <div class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1>Synchroniser</h1>
  </div>
  <div class="content">

    <div class="banner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M5.5 15a8 8 0 0013 3.5M18.5 9A8 8 0 005.5 5.5"/></svg>
      3 appareils détectés sur le même Wi‑Fi
    </div>

    <div class="eyebrow">Appareils à proximité</div>

    <div class="row">
      <div class="devicon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg></div>
      <div class="grow"><div class="dname">iPhone de Camille</div><div class="dsub">192.168.1.42</div></div>
      <button class="btn-small">Synchroniser</button>
    </div>

    <div class="row progress-row">
      <div class="progress-top">
        <div class="devicon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M10 19h4"/></svg></div>
        <div class="grow"><div class="dname">Pixel de Théo</div><div class="dsub">Synchronisation… 64%</div></div>
        <div class="spinner"></div>
      </div>
      <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="row">
      <div class="devicon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg></div>
      <div class="grow"><div class="dname">iPad de Marion</div><div class="dsub">192.168.1.58</div></div>
      <button class="btn-small-outline">Synchroniser</button>
    </div>

    <div class="eyebrow">Dernière synchro</div>

    <div class="resultcard">
      <div class="resulttop">
        <div class="warnbadge"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg></div>
        <div class="grow"><div class="dname">Avec Camille</div><div class="dsub">Il y a 5 min · 2 conflits à résoudre</div></div>
      </div>
      <button class="btn-small-outline" style="width:100%;">Voir les conflits</button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
